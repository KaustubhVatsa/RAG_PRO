dle">evidence?</text><text x="1095.0" y="330.1" font-size="14" fill="#495057" text-anchor="middle">[R5]</text><rect x="700" y="100" width="250" height="80" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/><text x="825.0" y="126.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Re-query</text><text x="825.0" y="151.3" font-size="14" fill="#495057" text-anchor="middle">[R5] new search, max 3</text><text x="825.0" y="168.8" font-size="14" fill="#495057" text-anchor="middle">rounds</text><rect x="1280" y="250" width="250" height="100" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="1405.0" y="282.2" font-size="20" fill="#1e1e1e" text-anchor="middle">Answer with [n]</text><text x="1405.0" y="307.2" font-size="20" fill="#1e1e1e" text-anchor="middle">citations</text><text x="1405.0" y="332.6" font-size="14" fill="#495057" text-anchor="middle">main LLM, grounded prompt</text><rect x="1280" y="480" width="250" height="100" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="1405.0" y="516.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Verbatim quote check</text><text x="1405.0" y="541.3" font-size="14" fill="#495057" text-anchor="middle">[R2] done: quote must appear</text><text x="1405.0" y="558.8" font-size="14" fill="#495057" text-anchor="middle">in chunk</text><rect x="970" y="480" width="250" height="100" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="1095.0" y="516.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Split into claims</text><text x="1095.0" y="541.3" font-size="14" fill="#495057" text-anchor="middle">sentences; failed quote →</text><text x="1095.0" y="558.8" font-size="14" fill="#495057" text-anchor="middle">unsupported</text><rect x="660" y="480" width="250" height="100" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/><text x="785.0" y="516.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Verify each claim</text><text 