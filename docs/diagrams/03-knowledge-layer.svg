<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -26 1590 946" width="1590" height="946" font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="0" y="-26" width="1590" height="946" fill="#ffffff"/><defs><marker id="m343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><text x="40.0" y="44.4" font-size="32" fill="#1e1e1e" text-anchor="start">Knowledge layer: ingestion and retrieval</text><text x="42.0" y="73.2" font-size="16" fill="#495057" text-anchor="start">partner&#x27;s half: PDF in, ranked passages out (task ids in brackets)</text><text x="40.0" y="111.2" font-size="16" fill="#2f9e44" text-anchor="start">INGESTION: once per uploaded PDF, in the background</text><rect x="40" y="130" width="210" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="145.0" y="179.8" font-size="20" fill="#1e1e1e" text-anchor="middle">PDF upload</text><text x="145.0" y="205.1" font-size="14" fill="#495057" text-anchor="middle">from the API, max 25 MB</text><rect x="300" y="130" width="210" height="110" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="405.0" y="162.2" font-size="20" fill="#1e1e1e" text-anchor="middle">parse_pdf [P2]</text><text x="405.0" y="187.6" font-size="14" fill="#495057" text-anchor="middle">PyMuPDF · blocks,</text><text x="405.0" y="205.1" font-size="14" fill="#495057" text-anchor="middle">headings · drop</text><text x="405.0" y="222.6" font-size="14" fill="#495057" text-anchor="middle">headers/footers</text><rect x="560" y="130" width="210" height="110" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="665.0" y="162.2" font-size="20" fill="#1e1e1e" text-anchor="middle">chunk_pages [P3]</text><text x="665.0" y="187.6" font-size="14" fill="#495057" text-anchor="middle">section-aware · ~400</text><text x="665.0" y="205.1" font-size="14" fill="#495057" text-anchor="middle">tokens · overlap · keep</text><text x="665.0" y="222.6" font-size="14" fill="#495057" text-anchor="middle">page</text><rect x="820" y="130" width="210" height="110" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="925.0" y="171.0" font-size="20" fill="#1e1e1e" text-anchor="middle">embed [P4]</text><text x="925.0" y="196.3" font-size="14" fill="#495057" text-anchor="middle">bge-small (384-d) ·</text><text x="925.0" y="213.8" font-size="14" fill="#495057" text-anchor="middle">batched</text><rect x="1080" y="130" width="210" height="110" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1185.0" y="167.2" font-size="20" fill="#1e1e1e" text-anchor="middle">Mongo upsert</text><text x="1185.0" y="192.2" font-size="20" fill="#1e1e1e" text-anchor="middle">[P5]</text><text x="1185.0" y="217.6" font-size="14" fill="#495057" text-anchor="middle">chunks + vectors</text><rect x="1340" y="130" width="210" height="110" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1445.0" y="171.0" font-size="20" fill="#1e1e1e" text-anchor="middle">status = ready</text><text x="1445.0" y="196.3" font-size="14" fill="#495057" text-anchor="middle">or failed + error,</text><text x="1445.0" y="213.8" font-size="14" fill="#495057" text-anchor="middle">never raises</text><path d="M250.0,185.0 L300.0,185.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M510.0,185.0 L560.0,185.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M770.0,185.0 L820.0,185.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M1030.0,185.0 L1080.0,185.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M1290.0,185.0 L1340.0,185.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><rect x="560" y="330" width="960" height="100" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="1040.0" y="374.8" font-size="20" fill="#1e1e1e" text-anchor="middle">MongoDB (Atlas)</text><text x="1040.0" y="400.1" font-size="14" fill="#495057" text-anchor="middle">chunks: text + embedding + page + section · vector index (HNSW, cosine) · text index (BM25) · always filtered by doc_id</text><path d="M1185.0,240.0 L1185.0,330.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><text x="1196.0" y="275.3" font-size="14" fill="#343a40" text-anchor="start">upsert</text><text x="40.0" y="485.2" font-size="16" fill="#2f9e44" text-anchor="start">RETRIEVAL: every question</text><rect x="40" y="590" width="190" height="90" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="135.0" y="621.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Query</text><text x="135.0" y="646.3" font-size="14" fill="#495057" text-anchor="middle">from the reasoning</text><text x="135.0" y="663.8" font-size="14" fill="#495057" text-anchor="middle">agent</text><rect x="280" y="520" width="200" height="90" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="380.0" y="547.2" font-size="20" fill="#1e1e1e" text-anchor="middle">embed_query</text><text x="380.0" y="572.2" font-size="20" fill="#1e1e1e" text-anchor="middle">[P4]</text><text x="380.0" y="597.5" font-size="14" fill="#495057" text-anchor="middle">BGE query prefix</text><rect x="530" y="505" width="250" height="290" rx="12" fill="transparent" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/><text x="540.0" y="524.3" font-size="14" fill="#495057" text-anchor="start">run in parallel</text><rect x="550" y="535" width="210" height="100" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="655.0" y="567.2" font-size="20" fill="#1e1e1e" text-anchor="middle">Vector search</text><text x="655.0" y="592.2" font-size="20" fill="#1e1e1e" text-anchor="middle">[P7a]</text><text x="655.0" y="617.5" font-size="14" fill="#495057" text-anchor="middle">top 30 by cosine</text><rect x="550" y="675" width="210" height="100" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="655.0" y="707.2" font-size="20" fill="#1e1e1e" text-anchor="middle">BM25 search</text><text x="655.0" y="732.2" font-size="20" fill="#1e1e1e" text-anchor="middle">[P7a]</text><text x="655.0" y="757.5" font-size="14" fill="#495057" text-anchor="middle">keywords, top 30</text><rect x="830" y="590" width="200" height="100" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="930.0" y="613.5" font-size="20" fill="#1e1e1e" text-anchor="middle">RRF fusion</text><text x="930.0" y="638.5" font-size="20" fill="#1e1e1e" text-anchor="middle">[P7b]</text><text x="930.0" y="663.8" font-size="14" fill="#495057" text-anchor="middle">merge by rank, not</text><text x="930.0" y="681.3" font-size="14" fill="#495057" text-anchor="middle">score</text><rect x="1080" y="590" width="230" height="100" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1195.0" y="622.2" font-size="20" fill="#1e1e1e" text-anchor="middle">Cross-encoder</text><text x="1195.0" y="647.2" font-size="20" fill="#1e1e1e" text-anchor="middle">rerank [P7c]</text><text x="1195.0" y="672.5" font-size="14" fill="#495057" text-anchor="middle">top 30 → top k</text><rect x="1360" y="590" width="190" height="100" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="1455.0" y="634.8" font-size="20" fill="#1e1e1e" text-anchor="middle">ScoredChunk[ ]</text><text x="1455.0" y="660.0" font-size="14" fill="#495057" text-anchor="middle">→ Reasoning (Seam 1)</text><path d="M230.0,635.0 L280.0,565.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M230.0,635.0 L550.0,725.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><text x="236.0" y="703.3" font-size="14" fill="#343a40" text-anchor="start">keywords</text><path d="M480.0,565.0 L550.0,585.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M760.0,585.0 L830.0,640.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M760.0,725.0 L830.0,640.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M1030.0,640.0 L1080.0,640.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M1310.0,640.0 L1360.0,640.0" fill="none" stroke="#343a40" stroke-width="2" marker-end="url(#m343a40)"/><path d="M655.0,505.0 L655.0,430.0" fill="none" stroke="#343a40" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#m343a40)"/><text x="665.0" y="475.3" font-size="14" fill="#343a40" text-anchor="start">both read MongoDB</text><rect x="40" y="860" width="28" height="20" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="78.0" y="873.2" font-size="15" fill="#495057" text-anchor="start">Partner</text><rect x="310" y="860" width="28" height="20" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="348.0" y="873.2" font-size="15" fill="#495057" text-anchor="start">You (consumer)</text><rect x="580" y="860" width="28" height="20" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="618.0" y="873.2" font-size="15" fill="#495057" text-anchor="start">Datastore</text><rect x="850" y="860" width="28" height="20" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="888.0" y="873.2" font-size="15" fill="#495057" text-anchor="start">Input</text></svg>